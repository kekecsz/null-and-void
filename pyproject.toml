[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "null-and-void"
version = "0.1.0"
description = "Null & Void: a board game about the replication crisis, as software"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.11",
    "pyyaml>=6.0",
    "openai>=3.46",  # AI players (nv_ai); the rules engine does not need it
    "fastapi>=0.162",  # multiplayer server (nv_server)
    "uvicorn>=0.54",
    "websockets>=17.4",
]

[project.scripts]
nv-world = "nv_world.cli:main"
nv-play = "nv_server.text_client:main"
nv-sim = "nv_sim.run:main"
nv-server = "nv_server.app:main"

[project.optional-dependencies]
assets = ["pillow>=11"]  # asset_generation/make_icons.py
cloud = ["google-cloud-firestore>=2.20"]  # the deployed server's storage
dev = ["pytest>=8", "httpx>=0.28", "google-cloud-firestore>=2.20"]  # httpx: FastAPI's test client

[tool.setuptools.packages.find]
include = ["nv_core*", "nv_world*", "nv_server*", "nv_ai*", "nv_sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
