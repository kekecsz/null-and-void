[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "null-and-void"
version = "0.1.0"
description = "Null & Void: a board game about the replication crisis, as software"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.11",
    "pyyaml>=6.0",
    "openai>=3.46",  # AI players (nv_ai); the rules engine does not need it
    "fastapi>=0.162",  # multiplayer server (nv_server)
    "uvicorn>=0.54",
    "websockets>=17.4",
]

[project.scripts]
nv-world = "nv_world.cli:main"
nv-play = "nv_server.text_client:main"
nv-sim = "nv_sim.run:main"
nv-server = "nv_server.app:main"
nv-rulebook-pdf = "nv_rulebook.pdf:main"
nv-rulebook-illustrations = "nv_rulebook.illustrations:main"

[project.optional-dependencies]
assets = ["pillow>=11"]  # asset_generation/make_icons.py
cloud = ["google-cloud-firestore>=2.20"]  # the deployed server's storage
pdf = ["reportlab>=4"]  # nv-rulebook-pdf
illustrations = ["playwright>=1.65"]  # nv-rulebook-illustrations (drives Edge or Chrome)
dev = ["pytest>=8", "httpx>=0.28", "google-cloud-firestore>=2.20", "reportlab>=4"]  # httpx: FastAPI's test client

[tool.setuptools.packages.find]
include = ["nv_core*", "nv_world*", "nv_server*", "nv_ai*", "nv_sim*", "nv_rulebook*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The rulebook PDF (layout, figures, screenshot scenes) is checked only when asked for, as it is slow
# and changes with every rulebook export: pytest -m pdf (only those) or pytest -m "" (everything).
addopts = "-ra -m 'not pdf'"
markers = ["pdf: builds or lays out the rulebook PDF, or checks its pictures (run with -m pdf)"]
