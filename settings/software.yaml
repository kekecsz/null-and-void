# Null & Void: software settings (specification section 11).
#
# Game settings are in docs/parameter_defaults.yaml; these are settings of the software itself.
# API keys never go here: put them in settings/api_keys.env (git ignores that file).

# AI players (specification section 8)
ai_provider: openai
ai_default_model: gpt-6-luna
ai_reasoning_effort: medium          # the model's default; GPT-6 Luna accepts none, low, medium, high, xhigh, max
ai_max_cost_per_decision: 0.50       # USD per decision, reasoning included
ai_total_budget: 5.00                # USD for all AI calls, across runs (tracked in settings/ai_spending.csv)
ai_max_input_tokens: 30000           # per decision
ai_retry_limit: 2
ai_notes_max_chars: 2000

# USD per million tokens. Prices change: check the provider's pricing page and update.
ai_price_table:
  gpt-6-luna:                        # developers.openai.com/api/docs/models/gpt-6-luna, checked 2026-11-06
    input: 0.10
    cached_input: 0.01
    cache_write: 0.125               # 30-minute cache lifetime
    output: 0.50

# Server (specification section 6)
snapshot_every: round
max_instances: 1
